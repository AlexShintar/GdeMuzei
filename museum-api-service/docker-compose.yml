version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: gde_muzei
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: gdemuzeipassword
    restart: always
volumes:
  mongo-data: