services:
  mongodb:
    image: mongo:latest
    container_name: gde_muzei_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: gdemuzeipassword
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - gdemuzei-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: gde_muzei_auth
    ports:
      - "8083:8083"
    environment:
      MONGODB_URI: mongodb://admin:gdemuzeipassword@mongodb:27017/museum?authSource=admin
      JWT_ISSUER: http://auth-service:8083
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gdemuzei-network
    restart: unless-stopped

  museum-api:
    build:
      context: .
      dockerfile: museum-api-service/Dockerfile
    container_name: gde_muzei_museum_api
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: museum
      SPRING_DATA_MONGODB_USERNAME: admin
      SPRING_DATA_MONGODB_PASSWORD: gdemuzeipassword
      SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gdemuzei-network
    restart: unless-stopped

  admin-backend:
    build:
      context: .
      dockerfile: admin-backend-service/Dockerfile
    container_name: gde_muzei_admin
    ports:
      - "8081:8081"
    environment:
      CLIENTS_MUSEUM_API_BASE_URL: http://api-gateway:8080
      AUTH_SERVICE_URL: http://api-gateway:8080
      AUTH_USERNAME: admin1
      AUTH_PASSWORD: admin123
    depends_on:
      - auth-service
      - museum-api
    networks:
      - gdemuzei-network
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: gde_muzei_gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8083/.well-known/jwks.json
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth-service:8083
    depends_on:
      - auth-service
      - museum-api
      - admin-backend
    networks:
      - gdemuzei-network
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  gdemuzei-network:
    driver: bridge
