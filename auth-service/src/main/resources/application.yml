server:
  port: 8083

spring:
  application:
    name: auth-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://admin:gdemuzeipassword@localhost:27017/museum?authSource=admin}

jwt:
  issuer: ${JWT_ISSUER:http://localhost:8083}
  audience: ${JWT_AUDIENCE:gdemuzei-api}
  access-token:
    expiration: ${JWT_ACCESS_EXPIRATION:900000}  # 15 минут
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 дней

logging:
  level:
    ru.gdemuzei.auth: INFO
    org.springframework.security: WARN
    org.springframework.data.mongodb: INFO
